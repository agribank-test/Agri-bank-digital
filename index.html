<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الزراعي الرقمي — منصة التوعية بالتحول الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1d6b3a;--g2:#2f8a50;--gl:#e7f2ea;--gold:#c79a1e;--goldl:#fbf3dc;--bg:#f4f6f1;--card:#fff;--ink:#1d2a22;--mut:#66756b;--line:#e1e7df;--red:#b83b32;--redl:#fbe9e7;--blu:#245d93;--blul:#e6eff8}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.75}
header{background:linear-gradient(135deg,var(--g),#164f2b);color:#fff;padding:16px 18px 60px}
.hw{max-width:920px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .m{width:42px;height:42px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px;color:#1d2a22}
.logo h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.logo small{opacity:.8;font-size:12.5px}
.who{font-size:14px;opacity:.9}
main{max-width:920px;margin:-44px auto 40px;padding:0 14px}
nav{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px;flex-wrap:wrap}
nav button{flex:1;min-width:90px;border:0;background:none;padding:10px 6px;border-radius:10px;font:inherit;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer}
nav button.on{background:var(--gl);color:var(--g)}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.05);margin-bottom:14px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--gl) 0);display:grid;place-items:center;flex-shrink:0}
.ring div{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:26px;color:var(--g)}.ring span{font-size:12px;color:var(--mut)}
.hero h2{margin:0 0 4px;font-size:21px}
.tip{background:var(--goldl);border-right:5px solid var(--gold);border-radius:12px;padding:14px 16px}
.tip .h{font-weight:800;color:#7a5a00;font-size:14px}
.trks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.trk{display:flex;gap:12px;align-items:center;text-align:right;background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px;font:inherit;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.trk.on{border-color:var(--g);background:var(--gl)}
.trk .ic{font-size:30px}
.trk b{display:block;font-size:16px;color:var(--ink)}
.trk small{color:var(--mut);font-size:13px}
@media(max-width:520px){.trks{grid-template-columns:1fr}}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ls{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.05);cursor:pointer;border:2px solid transparent;transition:.15s;display:flex;flex-direction:column;gap:6px}
.ls:hover{border-color:var(--g2);transform:translateY(-2px)}
.ls .n{display:flex;justify-content:space-between;align-items:center}
.ls .num{width:34px;height:34px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:800}
.ls.done .num{background:var(--g);color:#fff}
.ls h3{margin:4px 0 0;font-size:17px}
.ls p{margin:0;color:var(--mut);font-size:14px}
.b{display:inline-block;padding:1px 10px;border-radius:20px;font-size:12.5px;font-weight:700}
.b-ok{background:var(--gl);color:var(--g)}.b-no{background:var(--redl);color:var(--red)}.b-off{background:#eee;color:#777}.b-gold{background:var(--goldl);color:#7a5a00}
.lesson h2{margin:0 0 4px;font-size:23px}
.lesson h4{margin:22px 0 6px;font-size:17px;color:var(--g)}
.lesson p{margin:0 0 10px}
.lesson ul{margin:0 0 10px;padding-right:22px}
.lesson li{margin-bottom:4px}
.ex{background:var(--blul);border-radius:12px;padding:12px 16px;margin:14px 0}
.ex .h{font-weight:800;color:var(--blu);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.steps div{background:var(--gl);border-radius:12px;padding:12px}
.steps b{display:block;color:var(--g)}
.steps span{font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 22px;font:inherit;font-weight:800;cursor:pointer;background:var(--g);color:#fff}
.btn.sec{background:var(--gl);color:var(--g)}
.btn:disabled{opacity:.5;cursor:default}
.back{background:none;border:0;color:var(--g);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:10px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.q .t{font-weight:800;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:6px}
.opt.right{background:var(--gl);border-color:var(--g2)}
.opt.wrong{background:var(--redl);border-color:var(--red)}
.expl{font-size:14px;color:var(--mut);margin-top:6px}
.result{text-align:center;padding:18px;border-radius:14px;margin-bottom:14px}
.result.pass{background:var(--gl)}.result.fail{background:var(--redl)}
.result b{font-size:30px;display:block}
.cert{border:6px double var(--gold);border-radius:16px;padding:30px 20px;text-align:center;background:linear-gradient(#fff,#fbfaf4)}
.cert .t{font-size:26px;font-weight:800;color:var(--g)}
.cert .nm{font-size:28px;font-weight:800;margin:10px 0;border-bottom:2px solid var(--gold);display:inline-block;padding:0 20px}
.gl{display:grid;gap:10px}
.gl div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gl b{color:var(--g)}
.gl i{font-style:normal;color:var(--mut);font-size:13px;margin-right:6px;direction:ltr;display:inline-block}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:13px;background:#fafbf8}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.kpi b{font-size:28px;display:block;line-height:1.2;color:var(--g)}.kpi span{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--gl);border-radius:8px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--g)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;background:var(--goldl);color:#6b4600;border:1px solid #f0d9a6}
.banner.err{background:var(--redl);color:var(--red);border-color:#f3c5c0}
.banner select{font:inherit;padding:3px 6px;border-radius:8px;border:1px solid #e0c98a}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1d2a22;color:#fff;padding:10px 20px;border-radius:12px;transition:.25s;z-index:9;font-weight:700}
#toast.on{transform:translateX(-50%) translateY(0)}
.hide{display:none}
@media print{header,nav,#banner,.btn,p,footer{display:none!important}body{background:#fff}.card{box-shadow:none}}
.who{cursor:pointer}
</style>
</head>
<body>
<header><div class="hw">
  <div class="logo"><div class="m">ر</div><div><h1>الزراعي الرقمي</h1><small>منصة توعية موظفي البنك الزراعي السوداني: التحول الرقمي والأمن السيبراني</small></div></div>
  <div class="who" id="who"></div>
</div></header>
<main>
  <div id="banner"></div>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>
<footer style="max-width:920px;margin:0 auto 30px;padding:18px 14px;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--line)">
  إعداد: <b style="color:var(--ink)">إدارة تقنية المعلومات — لؤي بشارة</b><br>
  لمزيد من المواضيع التعليمية: <a href="https://loaybushara.com" target="_blank" rel="noopener" style="color:var(--g);font-weight:700">loaybushara.com</a>
</footer>
<div id="toast"></div>

<script>
/* ================= المحتوى ================= */
const DT=[
{id:'l1',title:'ما هو التحول الرقمي؟',mins:5,sum:'الفرق بين شراء أجهزة وبين تغيير طريقة العمل نفسها.',
body:`<p>كثيرون يظنون أن التحول الرقمي يعني شراء أجهزة كمبيوتر أو إنشاء صفحة على فيسبوك. هذا جزء صغير فقط. التحول الرقمي هو <b>إعادة التفكير في طريقة تقديم الخدمة</b> باستخدام التقنية، بحيث تصبح أسرع وأدق وأقرب للعميل.</p>
<h4>ثلاث درجات يجب أن نفرّق بينها</h4>
<div class="steps">
<div><b>١. رقمنة البيانات</b><span>تحويل الورق إلى ملفات رقمية. مثال: تصوير ملف التمويل بالماسح الضوئي.</span></div>
<div><b>٢. رقمنة الإجراءات</b><span>تنفيذ نفس الخطوات لكن إلكترونياً. مثال: إدخال طلب التمويل في نظام بدل الدفتر.</span></div>
<div><b>٣. التحول الرقمي</b><span>تصميم الخدمة من جديد. مثال: المزارع يقدّم طلبه من جواله ويتابعه ويستلم التمويل في محفظته.</span></div>
</div>
<p>معظم المؤسسات تتوقف عند الدرجة الأولى أو الثانية. القيمة الحقيقية تأتي في الدرجة الثالثة، عندما نسأل: <b>لو بدأنا من الصفر اليوم، كيف سنقدّم هذه الخدمة؟</b></p>
<h4>التحول الرقمي ليس مشروع تقنية</h4>
<ul><li><b>الناس:</b> موظفون يفهمون التقنية ويثقون بها.</li><li><b>الإجراءات:</b> خطوات عمل مبسّطة بلا تكرار ولا توقيعات زائدة.</li><li><b>التقنية:</b> الأنظمة والأجهزة والشبكات.</li></ul>
<p>إذا اشترينا أفضل نظام ولم نغيّر الإجراءات ولم ندرّب الموظفين، سنحصل على "فوضى رقمية" بدل "فوضى ورقية".</p>
<div class="ex"><div class="h">من واقع البنك</div>إذا أدخلنا طلب التمويل في جهاز كمبيوتر، ثم طبعناه ليوقّع عليه خمسة أشخاص، ثم أرسلناه بالبريد إلى الرئاسة، فنحن لم نتحوّل رقمياً — فقط أضفنا خطوة!</div>`,
quiz:[
{q:'أيّ مما يلي يمثّل "تحولاً رقمياً" حقيقياً وليس مجرد رقمنة؟',o:['تصوير ملفات العملاء وحفظها في الكمبيوتر','شراء أجهزة كمبيوتر جديدة للفروع','تمكين المزارع من تقديم طلب التمويل ومتابعته واستلامه عبر الجوال','طباعة الاستمارات بالكمبيوتر بدل كتابتها باليد'],a:2,e:'التحول الرقمي يعيد تصميم الخدمة كاملة من منظور العميل، أما الخيارات الأخرى فهي رقمنة لبيانات أو أدوات فقط.'},
{q:'ما العناصر الثلاثة التي يقوم عليها التحول الرقمي؟',o:['الأجهزة والبرامج والإنترنت','الناس والإجراءات والتقنية','الإدارة والميزانية والمباني','العملاء والمنافسون والبنك المركزي'],a:1,e:'التقنية وحدها لا تكفي؛ يجب أن يتغيّر الناس (المهارات والثقافة) والإجراءات معها.'},
{q:'ماذا يحدث إذا اشترينا نظاماً حديثاً دون تغيير الإجراءات أو تدريب الموظفين؟',o:['يتحسّن العمل تلقائياً','نحصل على فوضى رقمية بدل الفوضى الورقية','يصبح العمل أسرع بالضرورة','لا يحدث أي شيء'],a:1,e:'النظام الحديث فوق إجراءات قديمة ينقل المشكلة من الورق إلى الشاشة فقط.'}]},

{id:'l2',title:'لماذا يحتاج البنك الزراعي التحول الرقمي الآن؟',mins:5,sum:'كيف غيّرت الحرب الواقع وجعلت الرقمنة ضرورة لا رفاهية.',
body:`<p>قبل الحرب كان التحول الرقمي "مشروعاً للمستقبل". اليوم أصبح <b>مسألة استمرارية</b>. هذه أهم الأسباب:</p>
<h4>١. حماية السجلات من الضياع</h4>
<p>عندما تكون السجلات ورقية في فرع واحد، فإن أي حريق أو نهب أو إغلاق للفرع يعني ضياع تاريخ العملاء وديونهم وضماناتهم. السجل الرقمي المحفوظ بنسخ احتياطية في أكثر من مكان لا يضيع بضياع المبنى.</p>
<h4>٢. العملاء تفرّقوا</h4>
<p>كثير من المزارعين والعملاء نزحوا إلى ولايات أخرى أو خارج البلاد. العميل الذي لا يستطيع الوصول إلى فرعه يحتاج قناة بديلة: تطبيق، رسالة نصية، أو وكيل قريب منه.</p>
<h4>٣. شحّ النقد</h4>
<p>مع صعوبة توفر الأوراق النقدية، انتشر الدفع عبر الجوال بشكل كبير في السودان، وأصبح تطبيق مثل "بنكك" جزءاً من الحياة اليومية لملايين الناس. البنك الذي لا يقدّم قنوات رقمية يخسر عملاءه لصالح من يقدّمها.</p>
<h4>٤. القطاع كله يتحرّك</h4>
<p>بنك السودان المركزي يعمل على أنظمة مقاصة إلكترونية لإعادة الثقة في الجهاز المصرفي، وتعمل شركات تقنية مالية على ربط تطبيقات البنوك والمحافظ ببعضها. البنك الذي يجهّز أنظمته وموظفيه مبكراً سيستفيد أولاً.</p>
<h4>٥. طبيعة عملاء البنك الزراعي</h4>
<p>المزارع يعيش غالباً بعيداً عن الفرع، ووقته مرتبط بالموسم. كل رحلة إلى الفرع تكلّفه يوم عمل ومصاريف سفر. الخدمة الرقمية توفّر عليه هذا وتجعل البنك أقرب إليه.</p>
<div class="ex"><div class="h">سؤال للتفكير</div>كم ملفاً في فرعك موجود في نسخة واحدة فقط على الورق؟ ماذا يحدث لو ضاع غداً؟</div>`,
quiz:[
{q:'ما أخطر ما يواجه السجلات الورقية في ظروف ما بعد الحرب؟',o:['أنها تأخذ مساحة كبيرة','أنها قد تضيع نهائياً بضياع الفرع لأنها في نسخة واحدة','أن خطها غير واضح','أنها مكلفة في الطباعة'],a:1,e:'السجل الورقي غالباً نسخة وحيدة؛ الحفظ الرقمي مع النسخ الاحتياطي يحمي البيانات حتى لو ضاع المبنى.'},
{q:'لماذا أصبحت القنوات الرقمية مهمة بشكل خاص لعملاء البنك الزراعي؟',o:['لأن المزارعين يفضّلون التقنية','لأنهم بعيدون عن الفروع وكثير منهم نزح، ورحلة الفرع مكلفة','لأن الفروع لا تقبل المزارعين','لأنها موضة حديثة'],a:1,e:'البعد الجغرافي والنزوح وتكلفة الوصول للفرع تجعل الخدمة عن بُعد ضرورة.'},
{q:'ما أثر شحّ النقد على سلوك العملاء؟',o:['عادوا إلى الادخار في المنازل فقط','زاد اعتمادهم على الدفع والتحويل عبر الجوال','توقفوا عن التعامل المالي','لا أثر له'],a:1,e:'انتشر الدفع عبر تطبيقات الجوال كبديل عملي للنقد الورقي.'}]},

{id:'l3',title:'البيانات: أساس كل شيء',mins:6,sum:'جودة البيانات والنسخ الاحتياطي وقاعدة ٣-٢-١.',
body:`<p>أي نظام حديث، مهما كان متطوراً، يعتمد على البيانات التي ندخلها نحن. القاعدة المعروفة: <b>مدخلات خاطئة = مخرجات خاطئة</b>.</p>
<h4>صفات البيانات الجيدة</h4>
<ul><li><b>دقيقة:</b> رقم الهاتف صحيح، والاسم مكتوب كما في الهوية.</li><li><b>كاملة:</b> لا حقول فارغة في البيانات الأساسية.</li><li><b>موحّدة:</b> العميل له سجل واحد فقط، وليس سجلاً في كل فرع بتهجئة مختلفة.</li><li><b>محدّثة:</b> عنوان المزارع النازح يُحدَّث عند تواصله معنا.</li></ul>
<div class="ex"><div class="h">مثال</div>"محمد أحمد عثمان" في فرع، و"محمد احمد عتمان" في فرع آخر، و"م. أحمد عثمان" في ثالث. ثلاثة سجلات لنفس الشخص! النتيجة: لا نعرف حجم مديونيته الحقيقي. الحل: معرّف موحّد للعميل (مثل الرقم الوطني) يُربط به كل شيء.</div>
<h4>النسخ الاحتياطي: قاعدة ٣-٢-١</h4>
<div class="steps"><div><b>٣ نسخ</b><span>من كل بيانات مهمة.</span></div><div><b>٢ وسيلتان</b><span>مختلفتان للتخزين (جهاز + قرص خارجي أو سحابة).</span></div><div><b>١ نسخة</b><span>خارج المبنى أو المدينة.</span></div></div>
<p>في ظروف الحرب، النسخة الموجودة خارج المدينة هي التي تنقذ البنك.</p>
<h4>الحوسبة السحابية باختصار</h4>
<p>بدل أن تكون الخوادم داخل الفرع، تُستأجر من مراكز بيانات مؤمّنة ومجهّزة بالكهرباء الاحتياطية، ويصل إليها الفرع عبر الإنترنت. ميزتها أن البيانات تبقى حتى لو أُغلق الفرع، لكنها تحتاج اتصالاً جيداً وضوابط واضحة لحماية بيانات العملاء والالتزام بتعليمات البنك المركزي.</p>`,
quiz:[
{q:'ما المقصود بقاعدة ٣-٢-١ للنسخ الاحتياطي؟',o:['٣ موظفين، ٢ مدير، ١ نظام','٣ نسخ، على وسيلتين مختلفتين، ونسخة واحدة خارج المبنى','٣ أيام، أسبوعان، شهر واحد','٣ ملفات في كل مجلد'],a:1,e:'هذه القاعدة تضمن أن ضياع جهاز أو مبنى لا يعني ضياع البيانات.'},
{q:'لماذا يُعد وجود أكثر من سجل لنفس العميل مشكلة؟',o:['لأنه يستهلك ورقاً','لأننا لا نعرف حقيقة وضعه، مثل حجم مديونيته الكلي','لأن العميل يغضب','ليست مشكلة'],a:1,e:'السجل الموحّد للعميل يعطي صورة كاملة ودقيقة عن تعاملاته.'},
{q:'ما معنى "مدخلات خاطئة = مخرجات خاطئة"؟',o:['أن النظام يصلح الأخطاء تلقائياً','أن جودة نتائج النظام تعتمد على دقة البيانات التي نُدخلها','أن الأنظمة الحديثة لا تخطئ','أن الأخطاء تحدث في الطباعة فقط'],a:1,e:'النظام لا يعرف أن الرقم خاطئ؛ مسؤولية الدقة تبدأ من الموظف.'}]},

{id:'l4',title:'الأنظمة المصرفية الحديثة',mins:6,sum:'النظام المصرفي الأساسي والقنوات الرقمية وربط الأنظمة.',
body:`<h4>النظام المصرفي الأساسي (Core Banking)</h4>
<p>هو "قلب" البنك: نظام مركزي واحد تُسجَّل فيه الحسابات والعمليات والتمويلات لكل الفروع لحظياً. بفضله يستطيع العميل التعامل من أي فرع، وتعرف الإدارة وضع البنك كله في أي لحظة.</p>
<h4>القنوات الرقمية</h4>
<ul><li><b>تطبيق الجوال:</b> للعملاء الذين يملكون هاتفاً ذكياً وإنترنت.</li><li><b>خدمة الرموز (USSD):</b> مثل *123# — تعمل على أي هاتف بسيط وبدون إنترنت. مهمة جداً للمزارعين في الريف.</li><li><b>الرسائل النصية (SMS):</b> لإشعار العميل بكل عملية وبمواعيد الأقساط.</li><li><b>الوكلاء المصرفيون:</b> متجر أو تاجر في القرية يقدّم خدمات إيداع وسحب بسيطة نيابة عن البنك.</li></ul>
<h4>ربط الأنظمة ببعضها (التشغيل البيني)</h4>
<p>المشكلة الشائعة أن كل بنك وكل محفظة "جزيرة" منفصلة. الربط البيني يسمح للعميل أن يحوّل من حسابه في بنك إلى محفظة في بنك آخر بسهولة. هذا الاتجاه يتسارع في السودان، والبنك الجاهز تقنياً للربط سيصل إلى عملاء أكثر.</p>
<h4>التعرّف الرقمي على العميل (e-KYC)</h4>
<p>فتح حساب عن بُعد: يصوّر العميل هويته ووجهه بالجوال، ويتحقق النظام منها. يوفر على العميل زيارة الفرع، لكنه يحتاج ضوابط صارمة ضد التزوير.</p>
<div class="ex"><div class="h">تخيّل معي</div>مزارع في قرية بعيدة، بهاتف بسيط، يستقبل رسالة: "قسطك القادم بتاريخ ١٥ ديسمبر". يطلب *رمز البنك# ويسدد من رصيد محفظته، ويصله إشعار فوري. لم يسافر، ولم يقف في صف.</div>`,
quiz:[
{q:'ما وظيفة النظام المصرفي الأساسي (Core Banking)؟',o:['تصميم إعلانات البنك','نظام مركزي يسجّل الحسابات والعمليات لكل الفروع لحظياً','برنامج لطباعة الشيكات','نظام لحضور الموظفين'],a:1,e:'هو قلب البنك الذي يوحّد البيانات والعمليات بين جميع الفروع.'},
{q:'ما أنسب قناة رقمية لمزارع يملك هاتفاً بسيطاً بدون إنترنت؟',o:['تطبيق الجوال الذكي','الموقع الإلكتروني','خدمة الرموز USSD والرسائل النصية','البريد الإلكتروني'],a:2,e:'USSD تعمل على أي هاتف ولا تحتاج إنترنت، لذلك تناسب الريف.'},
{q:'ما المقصود بالتشغيل البيني؟',o:['أن يعمل الموظفون بنظام الورديات','ربط البنوك والمحافظ ببعضها ليتمكن العميل من التحويل بينها بسهولة','تشغيل الأجهزة ليلاً','تبادل الموظفين بين الفروع'],a:1,e:'الربط البيني يحوّل "الجزر المنفصلة" إلى شبكة واحدة يستفيد منها الجميع.'}]},

{id:'l5',title:'التمويل الزراعي الرقمي',mins:6,sum:'كيف تغيّر التقنية دورة التمويل من التقديم إلى السداد.',
body:`<p>هنا يكمن تميّز البنك الزراعي. التقنية يمكن أن تمسّ كل مرحلة في دورة التمويل الزراعي:</p>
<div class="steps">
<div><b>١. سجل المزارعين الرقمي</b><span>ملف لكل مزارع: الهوية، الأرض، المحاصيل، تاريخ التمويل والسداد.</span></div>
<div><b>٢. التقديم والتقييم</b><span>طلب إلكتروني، وتقييم بمعايير واضحة بدل الاجتهاد الشخصي.</span></div>
<div><b>٣. المعاينة الميدانية</b><span>تطبيق للمفتش يسجّل موقع المزرعة (GPS) وصوراً حتى بدون شبكة.</span></div>
<div><b>٤. الصرف</b><span>إلى محفظة المزارع أو مباشرة للمورّد (بذور، سماد) لضمان الاستخدام الصحيح.</span></div>
<div><b>٥. المتابعة</b><span>صور الأقمار الصناعية تكشف حالة المحصول، وتنبيهات الطقس تصل للمزارع برسالة.</span></div>
<div><b>٦. السداد</b><span>تذكير تلقائي قبل الموعد، وسداد من الجوال، وإشعار فوري.</span></div>
</div>
<h4>الفوائد المباشرة</h4>
<ul><li>تقليل التعثّر لأن المتابعة مستمرة والتذكير تلقائي.</li><li>تقليل الاحتيال لأن الموقع والصور موثّقة.</li><li>بناء "تاريخ ائتماني" للمزارع الملتزم يجعله يحصل على تمويل أسرع في الموسم التالي.</li><li>قرارات إدارية مبنية على أرقام: أي ولاية وأي محصول أعلى سداداً؟</li></ul>
<div class="ex"><div class="h">ابدأ صغيراً</div>لا يلزم بناء كل هذا دفعة واحدة. مجرد جدول إلكتروني موحّد لأقساط المزارعين في الفرع، مع تذكير برسالة نصية قبل الموعد بأسبوع، يمكن أن يُحدث فرقاً ملموساً في نسب السداد.</div>`,
quiz:[
{q:'ما فائدة صرف التمويل مباشرة إلى مورّد المدخلات الزراعية؟',o:['تأخير وصول التمويل','ضمان استخدام التمويل في غرضه الصحيح','زيادة الرسوم','لا فائدة'],a:1,e:'الصرف المباشر للمورّد يضمن أن التمويل يتحوّل إلى بذور وسماد فعلاً.'},
{q:'كيف يساعد تسجيل موقع المزرعة (GPS) والصور أثناء المعاينة؟',o:['يجعل التقرير أجمل','يوثّق وجود المزرعة وحالتها ويقلل الاحتيال','يغني عن زيارة المزرعة','يزيد مساحة الأرض'],a:1,e:'التوثيق الرقمي يصعّب تقديم بيانات وهمية ويحفظ دليلاً للمراجعة.'},
{q:'ما أبسط خطوة رقمية يمكن أن يبدأ بها الفرع لتحسين نسب السداد؟',o:['شراء طائرة مسيّرة','بناء نظام ذكاء اصطناعي','جدول أقساط إلكتروني موحّد مع تذكير برسالة قبل الموعد','انتظار النظام المركزي'],a:2,e:'الخطوات الصغيرة العملية تحقق أثراً سريعاً وتبني الثقة في التحول الرقمي.'}]},

{id:'l6',title:'دورك أنت في التحول الرقمي',mins:5,sum:'ماذا يستطيع كل موظف أن يفعل ابتداءً من الغد.',
body:`<p>التحول الرقمي لا ينجح بقرار من الإدارة وحده. ينجح عندما يؤمن به الموظف في الفرع، لأنه هو من يتعامل مع العميل والبيانات كل يوم.</p>
<h4>مقاومة التغيير أمر طبيعي</h4>
<p>من الطبيعي أن نشعر بالقلق: "هل سيأخذ النظام وظيفتي؟"، "ماذا لو أخطأت؟". الحقيقة أن التقنية تأخذ <b>المهام المتكررة المملة</b> وتترك للموظف العمل الأهم: خدمة العميل، والتقييم، والحكم المهني. الموظف الذي يتقن الأدوات الرقمية تزداد قيمته ولا تنقص.</p>
<h4>خمس خطوات تبدأ بها غداً</h4>
<ul>
<li><b>أدخل البيانات بدقة:</b> كل رقم هاتف صحيح اليوم هو رسالة تذكير تصل غداً.</li>
<li><b>احمِ حسابك:</b> لا تشارك كلمة المرور ولا رمز التحقق (OTP) مع أي أحد، حتى لو ادّعى أنه من الإدارة.</li>
<li><b>تعلّم أداة واحدة جيداً:</b> Excel مثلاً، يوفّر ساعات من الحساب اليدوي.</li>
<li><b>لاحظ الهدر:</b> أي عمل تكرره كل يوم يدوياً؟ هذا مرشّح للأتمتة.</li>
<li><b>شارك فكرتك:</b> أفضل أفكار التحول تأتي من الموظفين في الخط الأمامي.</li>
</ul>
<h4>سؤال أخير</h4>
<p>اكتب لنفسك: <b>ما المهمة اليدوية التي تأخذ أكثر وقت مني كل أسبوع؟</b> وكيف يمكن أن تساعد التقنية فيها؟ هذه بداية مشروعك الرقمي الأول.</p>
<div class="ex"><div class="h">تذكّر</div>التحول الرقمي رحلة وليس مشروعاً ينتهي. كل خطوة صغيرة تبني الثقة للخطوة التالية.</div>`,
quiz:[
{q:'ما الذي تأخذه التقنية عادةً من عمل الموظف؟',o:['خدمة العملاء بالكامل','المهام المتكررة اليدوية','الحكم المهني والتقييم','لا شيء'],a:1,e:'الأتمتة تستهدف التكرار، وتترك للموظف العمل الذي يحتاج تفكيراً وعلاقة إنسانية.'},
{q:'اتصل بك شخص يقول إنه من إدارة تقنية المعلومات ويطلب رمز التحقق (OTP) الذي وصلك. ماذا تفعل؟',o:['أعطيه الرمز لأنه من الإدارة','أعطيه نصف الرمز فقط','لا أشارك الرمز مع أي أحد وأبلّغ عن المحاولة','أطلب منه الانتظار ثم أعطيه'],a:2,e:'رمز التحقق لا يُشارك أبداً. أي طلب له هو مؤشر احتيال يجب الإبلاغ عنه.'},
{q:'من أين تأتي غالباً أفضل أفكار التحول الرقمي؟',o:['من الشركات الأجنبية فقط','من الموظفين في الخط الأمامي الذين يرون المشكلات يومياً','من الإعلانات','من المنافسين'],a:1,e:'الموظف في الفرع يعرف أين يضيع الوقت وأين يتعب العميل.'}]}
];
const CS=[
{id:'c1',title:'ما هو الأمن السيبراني ولماذا يهمّ البنك؟',mins:5,sum:'المبادئ الثلاثة، ولماذا الإنسان هو خط الدفاع الأول.',
body:`<p>الأمن السيبراني هو <b>حماية الأنظمة والبيانات والأموال من السرقة والتخريب والتلاعب</b>. في البنك، كل معلومة عن عميل وكل عملية مالية هي هدف محتمل للمحتالين.</p>
<h4>ثلاثة مبادئ نحميها</h4>
<div class="steps">
<div><b>🔒 السرية</b><span>المعلومة لا يراها إلا من يحق له. مثال: رصيد العميل لا يُقال لأي متصل.</span></div>
<div><b>✅ السلامة</b><span>البيانات لا تُعدَّل إلا بشكل صحيح ومصرّح به. مثال: لا أحد يغيّر مبلغ قسط دون أثر.</span></div>
<div><b>⚡ التوفّر</b><span>النظام يعمل عندما نحتاجه. مثال: هجوم يوقف النظام يوقف خدمة كل العملاء.</span></div>
</div>
<h4>الإنسان هو الحلقة الأهم</h4>
<p>معظم الاختراقات في العالم لا تبدأ بقرصان عبقري يكسر الأنظمة، بل تبدأ بـ<b>موظف يضغط على رابط</b>، أو يعطي كلمة مروره لمتصل مقنع، أو يترك جهازه مفتوحاً. لذلك يمكن أن يكون الموظف أضعف حلقة أو أقوى خط دفاع.</p>
<h4>لماذا الخطر أكبر الآن؟</h4>
<ul><li>انتشار التعامل عبر الجوال والمحافظ جعل المال "رقمياً" وأسهل للسرقة عن بُعد.</li><li>ظروف الحرب والنزوح يستغلها المحتالون: "أنا من البنك، حسابك مجمّد بسبب الأحداث، أعطني الرمز لتفعيله".</li><li>تغيّر الموظفين وانتقالهم بين الفروع يُضعف معرفة "من هو من".</li><li>الضغط والاستعجال يجعلان الناس أقل حذراً.</li></ul>
<div class="ex"><div class="h">قاعدة ذهبية</div>المحتال لا يحتاج أن يخترق النظام إذا استطاع أن يقنعك أنت بأن تفتح له الباب.</div>`,
quiz:[
{q:'ما المبادئ الثلاثة الأساسية للأمن السيبراني؟',o:['السرعة والسعر والجودة','السرية والسلامة والتوفّر','الأجهزة والبرامج والشبكات','الإدارة والموظفون والعملاء'],a:1,e:'السرية (من يرى)، السلامة (من يعدّل)، التوفّر (هل يعمل النظام عند الحاجة).'},
{q:'كيف تبدأ معظم الاختراقات في الواقع؟',o:['بكسر التشفير بأجهزة خارقة','بخطأ بشري مثل الضغط على رابط أو مشاركة كلمة مرور','بانقطاع الكهرباء','بأعطال الأجهزة'],a:1,e:'المحتالون يستهدفون الإنسان لأنه أسهل من استهداف الأنظمة.'},
{q:'متصل يقول: "حسابك مجمّد بسبب الأحداث، أعطني الرمز الذي وصلك لتفعيله". ما هذا؟',o:['إجراء طبيعي من البنك','محاولة احتيال تستغل الظروف','خدمة عملاء جديدة','تحديث للنظام'],a:1,e:'البنك لا يطلب الرموز أبداً. استغلال الأحداث والاستعجال علامتان واضحتان على الاحتيال.'}]},

{id:'c2',title:'كلمات المرور والتحقق الثنائي',mins:5,sum:'كيف تصنع كلمة مرور قوية تتذكرها، ولماذا الرمز لا يُشارك.',
body:`<h4>أخطاء شائعة</h4>
<ul><li>استخدام <b>123456</b> أو الاسم أو تاريخ الميلاد أو رقم الهاتف.</li><li>نفس كلمة المرور للبريد والنظام وفيسبوك. إذا تسرّبت من موقع واحد، فُتحت كل الأبواب.</li><li>كتابتها على ورقة لاصقة على الشاشة.</li><li>إعطاؤها لزميل "ليكمل العمل" أثناء الإجازة.</li></ul>
<h4>كلمة المرور القوية = جملة</h4>
<p>بدل كلمة قصيرة معقدة يصعب تذكّرها، استخدم <b>جملة طويلة</b> لها معنى عندك فقط:</p>
<div class="ex"><div class="h">مثال</div>❌ <span dir="ltr">Ahmed1990</span> &nbsp; ← تُكسر في ثوانٍ<br>✅ <span dir="ltr">Sorghum-Harvest-InGezira-2026!</span> &nbsp; ← طويلة، سهلة التذكّر، صعبة الكسر</div>
<p>كل حرف إضافي يضاعف صعوبة الكسر عدة مرات. الطول أهم من التعقيد.</p>
<h4>التحقق الثنائي (2FA)</h4>
<p>هو قفل ثانٍ: بعد كلمة المرور، يطلب النظام رمزاً يصل إلى جوالك. حتى لو سُرقت كلمة مرورك، لن يدخل المحتال بدون جوالك. <b>فعّله في كل حساب يتيحه</b>: البريد، واتساب، التطبيقات البنكية.</p>
<h4>رمز التحقق (OTP) خط أحمر</h4>
<p>الرمز الذي يصلك برسالة هو <b>توقيعك الرقمي</b>. لا موظف تقنية، ولا مدير، ولا البنك المركزي، ولا شركة الاتصالات يحتاج أن يعرفه. من يطلبه منك هو محتال، دائماً وبلا استثناء.</p>
<h4>كلمة مرور العمل ملك لك وحدك</h4>
<p>كل عملية في النظام تُسجَّل باسم صاحب الحساب. إذا أعطيت كلمة مرورك لزميل وأخطأ أو تلاعب، فالسجل يقول إنك أنت من فعل ذلك.</p>`,
quiz:[
{q:'أيّ كلمات المرور التالية هي الأقوى؟',o:['Ahmed1990','123456789','P@ss1','Sorghum-Harvest-InGezira-2026!'],a:3,e:'الطول هو العامل الأهم؛ الجملة الطويلة أقوى بكثير وأسهل في التذكّر.'},
{q:'زميلك سيغيب أسبوعاً ويطلب أن يعطيك كلمة مروره لتكمل عمله. ما التصرّف الصحيح؟',o:['تقبل لأنها مساعدة','ترفض وتطلب من المدير منحك صلاحية مؤقتة رسمية','تقبل وتغيّرها بعد عودته','تكتبها في دفترك'],a:1,e:'كل عملية تُسجّل باسم صاحب الحساب. الصلاحيات تُمنح رسمياً ولا تُتبادل.'},

{id:'c3',title:'التصيّد والهندسة الاجتماعية',mins:6,sum:'كيف تكشف الرسالة أو المكالمة المزيفة قبل أن تقع.',
body:`<p><b>الهندسة الاجتماعية</b> هي فن خداع الناس ليعطوا معلومات أو يقوموا بفعل ما. <b>التصيّد</b> هو أشهر أشكالها: رسالة أو مكالمة مزيفة تبدو حقيقية.</p>
<h4>أشكاله</h4>
<ul><li><b>البريد الإلكتروني:</b> "حدّث بياناتك عبر هذا الرابط".</li><li><b>الرسائل النصية وواتساب:</b> "مبروك ربحت جائزة"، "طردك محجوز، ادفع الرسوم".</li><li><b>المكالمات:</b> "أنا من الرئاسة / من تقنية المعلومات / من البنك المركزي".</li></ul>
<h4>علامات التحذير الخمس</h4>
<div class="steps">
<div><b>⏰ الاستعجال</b><span>"الآن وإلا سيُغلق حسابك".</span></div>
<div><b>👔 السلطة</b><span>"المدير العام يطلب هذا شخصياً".</span></div>
<div><b>🎁 العرض المغري</b><span>جائزة، منحة، ترقية لم تتقدّم لها.</span></div>
<div><b>🔗 الرابط الغريب</b><span>عنوان قريب من الحقيقي مع حرف مختلف.</span></div>
<div><b>🤫 السرية</b><span>"لا تخبر أحداً بهذا الطلب".</span></div>
</div>
<h4>احتيال "المدير" (أخطرها على البنوك)</h4>
<p>رسالة واتساب من رقم جديد عليه صورة المدير: "أنا في اجتماع ولا أستطيع الكلام، حوّل مبلغ كذا لهذا الحساب بسرعة". الموظف يخاف أن يتأخر على المدير فيحوّل.</p>
<div class="ex"><div class="h">الحل البسيط: تحقّق من قناة أخرى</div>أغلق الرسالة، واتصل بالشخص على <b>رقمه المعروف المسجّل عندك</b> وليس على الرقم الذي راسلك. أي طلب مالي أو طلب معلومات حساسة يُتحقق منه بهذه الطريقة، مهما بدا مستعجلاً. المدير الحقيقي لن يغضب من حرصك.</div>
<h4>قبل أن تضغط على أي رابط</h4>
<ul><li>هل كنت تنتظر هذه الرسالة؟</li><li>هل المرسل معروف، ومن عنوانه أو رقمه المعتاد؟</li><li>هل الطلب منطقي ويمر بالإجراءات الرسمية؟</li></ul>`,
quiz:[
{q:'وصلتك رسالة واتساب من رقم جديد بصورة المدير يطلب تحويلاً عاجلاً. ماذا تفعل؟',o:['أحوّل فوراً حتى لا يغضب','أرد على نفس الرقم لأتأكد','أتصل بالمدير على رقمه المعروف المسجّل عندي قبل أي إجراء','أتجاهل الأمر ولا أبلّغ'],a:2,e:'التحقق عبر قناة مستقلة معروفة هو الحل؛ الرد على نفس الرقم يوصلك للمحتال نفسه.'},
{q:'أيّ مما يلي ليس من علامات رسائل التصيّد؟',o:['الاستعجال والتهديد','طلب السرية','رسالة متوقعة من زميل معروف عن موضوع عمل جارٍ عبر القناة الرسمية','عرض جائزة لم تشارك فيها'],a:2,e:'الرسالة المتوقعة من مصدر معروف عبر القناة المعتادة لا تحمل علامات الخطر، رغم أن الحذر مطلوب دائماً.'},
{q:'ما معنى "الهندسة الاجتماعية"؟',o:['تصميم المباني الاجتماعية','خداع الناس نفسياً ليعطوا معلومات أو يقوموا بفعل لصالح المحتال','دراسة المجتمع','برنامج لإدارة الموظفين'],a:1,e:'هي استغلال الثقة والخوف والاستعجال بدل اختراق الأنظمة تقنياً.'}]},

{id:'c4',title:'حماية الجهاز ومكان العمل',mins:5,sum:'التحديثات، ذاكرة USB، الشبكات العامة، والمكتب النظيف.',
body:`<h4>جهاز العمل</h4>
<ul><li><b>اقفل الشاشة</b> كلما قمت من مكتبك (Windows + L). جهاز مفتوح = أي شخص يعمل باسمك.</li><li><b>لا تؤجّل التحديثات</b>: معظمها يسد ثغرات يستغلها المخترقون.</li><li><b>لا تثبّت برامج</b> من مصادر غير معتمدة، حتى لو قيل إنها "مجانية ومفيدة".</li><li><b>برنامج الحماية</b> يجب أن يكون مفعّلاً ومحدّثاً.</li></ul>
<h4>ذاكرة USB: باب خلفي</h4>
<p>ذاكرة متداولة بين الأجهزة والمحلات والبيوت هي من أسهل طرق نقل البرامج الخبيثة. لا توصل بجهاز العمل أي ذاكرة مجهولة أو استُخدمت في أجهزة عامة. وإذا وجدت ذاكرة "ضائعة" في الفرع، سلّمها لتقنية المعلومات ولا تفتحها بدافع الفضول.</p>
<h4>الشبكات والجوال</h4>
<ul><li>شبكة Wi-Fi العامة (المقاهي، الفنادق) لا تُستخدم للدخول إلى أنظمة البنك.</li><li>الجوال الشخصي الذي فيه مجموعات عمل على واتساب يجب أن يكون عليه قفل شاشة.</li><li>لا تحفظ بيانات العملاء أو صور مستنداتهم في معرض صور جوالك.</li></ul>
<h4>المكتب النظيف</h4>
<p>الأمن ليس رقمياً فقط. ملف عميل مفتوح على المكتب، أو كشف حساب مرمي في سلة المهملات، أو كلمة مرور على ورقة، كلها تسريبات.</p>
<div class="ex"><div class="h">قبل أن تغادر يومياً</div>✓ الجهاز مقفل أو مطفأ &nbsp; ✓ المستندات في الدرج المقفل &nbsp; ✓ الأوراق الحساسة مُتلفة لا مرمية &nbsp; ✓ لا ذاكرة USB متروكة في الجهاز</div>`,
quiz:[
{q:'وجدت ذاكرة USB على أرض الفرع مكتوب عليها "رواتب". ماذا تفعل؟',o:['أفتحها لأعرف صاحبها','أسلّمها لتقنية المعلومات دون فتحها','أرميها','آخذها للبيت'],a:1,e:'قد تكون طُعماً مقصوداً يحمل برنامجاً خبيثاً؛ الفضول هو ما يعتمد عليه المهاجم.'},
{q:'لماذا يجب عدم تأجيل تحديثات النظام؟',o:['لأنها تغيّر الألوان','لأن كثيراً منها يسد ثغرات أمنية معروفة','لأنها تسرّع الإنترنت','ليست مهمة'],a:1,e:'الثغرة المعروفة غير المسدودة هي أسهل باب للمخترقين.'},
{q:'ما أفضل تصرّف بكشف حساب عميل لم تعد تحتاجه؟',o:['رميه في سلة المهملات','تركه على المكتب','إتلافه (تمزيقه أو بآلة الإتلاف) حسب الإجراءات','إعطاؤه لأي زميل'],a:2,e:'الورق المرمي مصدر تسريب حقيقي؛ المستندات الحساسة تُتلف ولا تُرمى.'}]},

{id:'c5',title:'حماية العملاء وكشف الاحتيال المالي',mins:6,sum:'سرية بيانات العميل وأنماط الاحتيال التي يجب أن تلفت انتباهك.',
body:`<h4>سرية العميل أمانة</h4>
<ul><li>لا تُعطى معلومات حساب العميل عبر الهاتف أو واتساب لأي شخص، حتى لو قال إنه قريبه أو محاميه، إلا وفق الإجراءات الرسمية.</li><li>لا تُرسل صور هويات العملاء أو مستنداتهم في مجموعات واتساب.</li><li>اطّلع فقط على الحسابات التي يتطلبها عملك.</li></ul>
<h4>أنماط احتيال يجب أن تنتبه لها</h4>
<div class="steps">
<div><b>📱 سرقة الشريحة</b><span>المحتال يستخرج شريحة بدل فاقد برقم العميل، فتصله رموز التحقق. انتبه لعميل يشتكي فجأة أن هاتفه "بلا شبكة".</span></div>
<div><b>📄 المستندات المزوّرة</b><span>هوية أو شهادة بحث أو عقد أرض بتفاصيل غير متطابقة أو جودة طباعة غريبة.</span></div>
<div><b>💸 الحساب الوسيط</b><span>حساب يستقبل مبالغ كثيرة من جهات مختلفة ويحوّلها فوراً للخارج. قد يكون صاحبه مستغَلاً من محتالين.</span></div>
<div><b>🔄 النشاط غير المعتاد</b><span>مزارع صغير تمر في حسابه فجأة مبالغ لا تتناسب مع نشاطه.</span></div>
</div>
<p>إذا لاحظت شيئاً من هذا، <b>لا تواجه العميل ولا تتهمه</b>؛ أبلغ مسؤول الالتزام أو المدير حسب الإجراءات.</p>
<h4>علّم عملاءك</h4>
<p>كثير من المزارعين جدد على الخدمات الرقمية، وهم الهدف الأسهل. جملة واحدة تقولها لكل عميل قد تحمي مدخراته:</p>
<div class="ex"><div class="h">قل لكل عميل</div>"البنك لن يتصل بك أبداً ليطلب الرقم السري أو الرمز الذي يصلك في الرسالة. من يطلبه منك محتال حتى لو عرف اسمك ورقم حسابك."</div>`,
quiz:[
{q:'اتصل شخص يقول إنه ابن العميل ويطلب معرفة رصيد والده المريض. ماذا تفعل؟',o:['أعطيه الرصيد تعاطفاً','أعتذر وأوضح أن المعلومات تُعطى لصاحب الحساب أو بتفويض رسمي فقط','أرسل له كشف الحساب على واتساب','أطلب منه رقم الحساب ثم أعطيه'],a:1,e:'سرية العميل لا تُكسر بالتعاطف؛ المحتالون يعرفون الأسماء ويستخدمون القصص المؤثرة.'},
{q:'عميل يشتكي أن هاتفه فقد الشبكة فجأة منذ يوم، ثم لاحظ تحويلات لم يقم بها. ما الاحتمال الأقوى؟',o:['عطل في البرج','سرقة الشريحة (استخراج بدل فاقد بالاحتيال)','خطأ من العميل','تحديث للهاتف'],a:1,e:'فقدان الشبكة المفاجئ مع عمليات مجهولة علامة كلاسيكية على سرقة الشريحة؛ يجب إيقاف الحساب والتبليغ فوراً.'},
{q:'ماذا تفعل إذا شككت أن حساب عميل يُستخدم في الاحتيال؟',o:['أواجه العميل وأتهمه','أتجاهل الأمر','أبلّغ مسؤول الالتزام أو المدير حسب الإجراءات دون إخبار العميل','أنشر الأمر في مجموعة الموظفين'],a:2,e:'التبليغ عبر القنوات الرسمية يحمي البنك ويحمي التحقيق؛ مواجهة العميل قد تنبّه المحتالين.'}]},

{id:'c6',title:'ماذا أفعل عند وقوع حادث أمني؟',mins:5,sum:'الدقائق الأولى بعد الخطأ هي الأهم. لا تُخفِ، بلّغ.',
body:`<p>الأخطاء تحدث لأي شخص. الفرق بين حادث صغير وكارثة هو <b>سرعة التبليغ</b>.</p>
<h4>علامات أن شيئاً ما خطأ</h4>
<ul><li>ضغطت على رابط ثم طُلب منك إدخال كلمة المرور في صفحة غريبة.</li><li>الجهاز أصبح بطيئاً جداً فجأة، أو تظهر نوافذ غريبة.</li><li>الملفات أصبحت لا تُفتح وبامتدادات غريبة، مع رسالة تطلب "فدية" لاستعادتها.</li><li>زملاء يقولون إنهم تلقوا منك رسائل لم ترسلها.</li><li>عمليات في النظام باسمك لم تقم بها.</li></ul>
<h4>الخطوات الخمس</h4>
<div class="steps">
<div><b>١. توقّف</b><span>لا تكمل ما كنت تفعله ولا تحاول الإصلاح بنفسك.</span></div>
<div><b>٢. افصل</b><span>افصل كابل الشبكة أو أطفئ Wi-Fi، لكن لا تُطفئ الجهاز ولا تحذف شيئاً.</span></div>
<div><b>٣. بلّغ فوراً</b><span>اتصل بتقنية المعلومات أو مديرك المباشر الآن، لا غداً.</span></div>
<div><b>٤. وثّق</b><span>ماذا حدث؟ متى؟ ما الرابط أو الرسالة؟ صوّر الشاشة بجوالك.</span></div>
<div><b>٥. غيّر</b><span>كلمات المرور المتأثرة من جهاز آخر سليم، بتوجيه من التقنية.</span></div>
</div>
<h4>برامج الفدية</h4>
<p>نوع من الهجمات يشفّر كل ملفات المؤسسة ويطلب مبلغاً لفكّها. الحماية الأهم منه: <b>النسخ الاحتياطي المنفصل</b> (قاعدة ٣-٢-١ من مسار التحول الرقمي)، والتبليغ السريع قبل أن ينتشر من جهاز إلى بقية الشبكة.</p>
<h4>ثقافة التبليغ بلا لوم</h4>
<p>الموظف الذي يخاف من العقوبة يُخفي خطأه، والخطأ المخفي يكبر. الموظف الذي يبلّغ خلال دقائق يحمي البنك كله. <b>التبليغ السريع عن خطأك هو تصرّف مسؤول وليس اعترافاً بالفشل.</b></p>
<div class="ex"><div class="h">احفظ الآن</div>اكتب في جوالك رقم مسؤول تقنية المعلومات في فرعك أو الرئاسة. وقت الحادث ليس وقت البحث عن الرقم.</div>`,
quiz:[
{q:'ضغطت على رابط مشبوه وأدخلت كلمة مرورك ثم أدركت الخطأ. ما أول ما تفعله؟',o:['أنتظر لأرى ماذا يحدث','أبلّغ تقنية المعلومات فوراً وأغيّر كلمة المرور بتوجيههم','أُخفي الأمر خوفاً من العقوبة','أعيد تشغيل الجهاز وأنسى'],a:1,e:'كل دقيقة تأخير تعطي المحتال وقتاً لاستخدام كلمة المرور.'},
{q:'ظهرت رسالة تقول إن ملفاتك مشفّرة وتطلب مبلغاً لفكّها. ماذا تفعل بالجهاز؟',o:['أطفئه وأحذف الملفات','أفصله عن الشبكة دون إطفائه وأبلّغ فوراً','أدفع المبلغ','أنقل الملفات لذاكرة USB'],a:1,e:'الفصل يمنع انتشار برنامج الفدية لبقية الأجهزة، وعدم الإطفاء يحفظ الأدلة للفنيين.'},
{q:'ما أهم حماية ضد برامج الفدية؟',o:['شاشة أكبر','نسخ احتياطية منفصلة وتبليغ سريع','كلمة مرور قصيرة','إطفاء الجهاز ليلاً'],a:1,e:'بالنسخة الاحتياطية المنفصلة يمكن استعادة البيانات دون دفع أي فدية.'}]}
];
const TRACKS=[
 {id:'dt',title:'التحول الرقمي',icon:'🌱',desc:'ستة دروس قصيرة تشرح التحول الرقمي من واقع عمل البنك الزراعي.',lessons:DT},
 {id:'cs',title:'الأمن السيبراني',icon:'🛡️',desc:'ستة دروس عملية تحميك وتحمي البنك والعملاء من الاحتيال والاختراق.',lessons:CS}

const PASS=2;
const TIPS=['لا تشارك رمز التحقق (OTP) مع أي أحد، حتى لو قال إنه من البنك.','قاعدة ٣-٢-١: ثلاث نسخ من بياناتك المهمة، على وسيلتين، وواحدة خارج المبنى.','اكتب رقم هاتف العميل مرتين وتأكد منه؛ رقم خاطئ يعني تذكيراً لا يصل.','كلمة مرور قوية = جملة طويلة تتذكرها، مثل: مزرعتي-في-الجزيرة-2026!','قبل الضغط على رابط في واتساب، اسأل: هل أنتظر هذه الرسالة فعلاً؟','في Excel، اضغط Ctrl+T لتحويل بياناتك إلى جدول يسهل فرزه وتصفيته.','أغلق شاشة جهازك (Windows+L) كلما قمت من مكتبك، ولو لدقيقة.','العميل له سجل واحد فقط. ابحث عنه قبل أن تنشئ سجلاً جديداً.','أي عمل تكرره يدوياً كل يوم هو فرصة للأتمتة. دوّنه.','حدّث نظام جوالك وتطبيقاته؛ التحديثات تسد ثغرات أمنية.','لا توصل ذاكرة USB مجهولة المصدر بجهاز العمل.','البيانات الدقيقة اليوم = قرارات صحيحة غداً.','إذا لم تفهم شيئاً في النظام الجديد، اسأل. السؤال أرخص من الخطأ.','رسالة مستعجلة تطلب تحويل أموال؟ تحقّق بالاتصال بالمرسل على رقمه المعروف.','احفظ الملفات في المجلد المشترك المعتمد، لا على سطح المكتب فقط.'];
const GLOSS=[['التحول الرقمي','Digital Transformation','إعادة تصميم الخدمات وطرق العمل باستخدام التقنية لتصبح أسرع وأقرب للعميل.'],['الرقمنة','Digitization','تحويل المعلومات من الورق إلى صيغة رقمية.'],['النظام المصرفي الأساسي','Core Banking','النظام المركزي الذي يسجّل الحسابات والعمليات لكل الفروع لحظياً.'],['الحوسبة السحابية','Cloud Computing','استخدام خوادم ومساحات تخزين في مراكز بيانات خارجية عبر الإنترنت.'],['النسخ الاحتياطي','Backup','نسخة إضافية من البيانات تُستعاد عند ضياع الأصل.'],['USSD','USSD','خدمة رموز مثل *123# تعمل على أي هاتف دون إنترنت.'],['المحفظة الإلكترونية','e-Wallet','حساب على الجوال لحفظ المال والدفع والتحويل.'],['التشغيل البيني','Interoperability','قدرة الأنظمة المختلفة (بنوك ومحافظ) على التعامل مع بعضها.'],['التعرّف الرقمي على العميل','e-KYC','التحقق من هوية العميل عن بُعد بالصور والوثائق الرقمية.'],['رمز التحقق','OTP','رمز يُرسل لمرة واحدة لتأكيد هوية صاحب الحساب. لا يُشارك أبداً.'],['التصيّد الاحتيالي','Phishing','رسائل أو روابط مزيفة تهدف لسرقة كلمات المرور أو الأموال.'],['الأتمتة','Automation','جعل النظام ينفّذ مهمة متكررة تلقائياً بدل الإنسان.'],['واجهة برمجة التطبيقات','API','طريقة منظّمة لتبادل البيانات بين نظامين.'],['الوكيل المصرفي','Banking Agent','تاجر أو جهة تقدّم خدمات مصرفية بسيطة نيابة عن البنك.'],['الشمول المالي','Financial Inclusion','وصول كل فئات المجتمع إلى الخدمات المالية الرسمية.'],['الأمن السيبراني','Cybersecurity','حماية الأنظمة والبيانات من الاختراق والسرقة.'],['التحقق الثنائي','2FA','قفل ثانٍ بعد كلمة المرور، غالباً رمز يصل للجوال.'],['الهندسة الاجتماعية','Social Engineering','خداع الناس نفسياً ليكشفوا معلومات أو يقوموا بفعل لصالح المحتال.'],['البرامج الخبيثة','Malware','برامج تُصمَّم لسرقة البيانات أو تخريب الأجهزة.'],['برامج الفدية','Ransomware','برنامج يشفّر ملفات المؤسسة ويطلب مبلغاً لفكّها.'],['سرقة الشريحة','SIM Swap','استخراج شريحة بدل فاقد برقم الضحية للحصول على رموز التحقق.'],['التصيّد الصوتي','Vishing','مكالمات هاتفية مزيفة تنتحل صفة بنك أو جهة رسمية.'],['تحديث الأمان','Security Patch','تحديث يسد ثغرة أمنية معروفة في النظام.']];

/* ================= الحالة والتخزين ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const fmt=ts=>{const d=new Date(ts);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const S={mode:'loading',me:null,admin:false,prog:{},names:{},view:'home',track:'dt',lesson:null,quiz:null,err:''};
let A=null;
function myProg(){return S.prog[S.me]||{done:{}}}
function passed(uid,id){const d=(S.prog[uid]&&S.prog[uid].done||{})[id];return d&&d.score>=PASS}
function doneCount(uid,tid){const ls=tid?TRACKS.find(t=>t.id===tid).lessons:LESSONS;return ls.filter(l=>passed(uid,l.id)).length}
function nameOf(u){return S.names[u]||'موظف'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2500)}

/* ================= العرض ================= */
function nav(){
  const items=[['home','الرئيسية'],['gloss','قاموس المصطلحات'],['cert','شهادتي']];if(S.admin)items.push(['admin','لوحة الإدارة']);
  const cur=S.view==='lesson'?'home':S.view;
  $('#nav').innerHTML=items.map(([k,v])=>`<button data-go="${k}" class="${cur===k?'on':''}">${v}</button>`).join('');
  $('#who').innerHTML=S.names.me?'👤 '+esc(S.names.me)+' <u style="cursor:pointer;font-size:12px">تغيير</u>':'';
  let b='';
  if(S.mode==='demo'){const opts=Object.keys(S.prog).map(u=>`<option value="${u}" ${u===S.me?'selected':''}>${esc(nameOf(u))}</option>`).join('');
    b+=`<div class="banner"><b>وضع تجريبي:</b> التقدّم هنا لا يُحفظ. جرّب كـ <select id="demoUser">${opts}</select> <label><input type="checkbox" id="demoAdmin" ${S.admin?'checked':''}> صلاحية إدارة</label></div>`}
  if(S.err)b+=`<div class="banner err">${esc(S.err)}</div>`;
  $('#banner').innerHTML=b;
}
function vHome(){
  const T=TRACKS.find(t=>t.id===S.track),L=T.lessons;
  const n=doneCount(S.me,T.id),p=Math.round(n/L.length*100);
  const tip=TIPS[Math.floor(Date.now()/864e5)%TIPS.length];
  const next=L.find(l=>!passed(S.me,l.id));
  const tabs=TRACKS.map(t=>{const k=doneCount(S.me,t.id);return `<button class="trk ${t.id===S.track?'on':''}" data-track="${t.id}"><span class="ic">${t.icon}</span><span><b>${t.title}</b><small>${k===t.lessons.length?'🎓 مكتمل':k+' من '+t.lessons.length+' دروس'}</small></span></button>`}).join('');
  return `<div class="trks">${tabs}</div>
  <div class="card hero"><div class="ring" style="--p:${p}"><div><div><b>${n}/${L.length}</b><br><span>دروس مكتملة</span></div></div></div>
  <div style="flex:1;min-width:220px"><h2>${T.icon} مسار ${T.title}</h2><div style="color:var(--mut)">${T.desc} كل درس حوالي ٥ دقائق، مع اختبار قصير بعده وشهادة في نهاية المسار.</div>
  <div style="margin-top:10px">${next?`<button class="btn" data-open="${next.id}">${n?'أكمل':'ابدأ'}: ${next.title}</button>`:`<button class="btn" data-go="cert">🎓 عرض شهادتي</button>`}</div></div></div>
  <div class="card tip"><div class="h">💡 نصيحة اليوم</div>${esc(tip)}</div>
  <div class="lessons">${L.map((l,i)=>{const d=myProg().done[l.id];const ok=passed(S.me,l.id);
    return `<div class="ls ${ok?'done':''}" data-open="${l.id}"><div class="n"><div class="num">${ok?'✓':i+1}</div>${ok?`<span class="b b-ok">مكتمل ${d.score}/${l.quiz.length}</span>`:d?`<span class="b b-no">أعد الاختبار</span>`:`<span class="b b-off">${l.mins} دقائق</span>`}</div><h3>${l.title}</h3><p>${l.sum}</p></div>`}).join('')}</div>`;
}
function vLesson(){
  const T=trackOf(S.lesson),L=T.lessons,l=L.find(x=>x.id===S.lesson),i=L.indexOf(l);
  let quiz='';
  if(S.quiz){
    const Q=S.quiz,sub=Q.submitted;
    if(sub){const sc=Q.ans.filter((a,k)=>a===l.quiz[k].a).length,ok=sc>=PASS;
      quiz+=`<div class="result ${ok?'pass':'fail'}"><b>${sc} / ${l.quiz.length}</b>${ok?'أحسنت! اجتزت هذا الدرس.':'تحتاج '+PASS+' إجابات صحيحة على الأقل. راجع الدرس وحاول مجدداً.'}</div>`}
    quiz+=l.quiz.map((q,k)=>`<div class="q"><div class="t">${k+1}. ${q.q}</div>${q.o.map((o,j)=>{let c='';if(sub){if(j===q.a)c='right';else if(Q.ans[k]===j)c='wrong'}
      return `<label class="opt ${c}"><input type="radio" name="q${k}" value="${j}" ${Q.ans[k]===j?'checked':''} ${sub?'disabled':''}> <span>${o}</span></label>`}).join('')}${sub?`<div class="expl">${q.e}</div>`:''}</div>`).join('');
    quiz+=sub?`<div style="display:flex;gap:10px;flex-wrap:wrap">${passed(S.me,l.id)&&L[i+1]?`<button class="btn" data-open="${L[i+1].id}">الدرس التالي ←</button>`:''}${passed(S.me,l.id)&&!L[i+1]&&doneCount(S.me,T.id)===L.length?`<button class="btn" data-go="cert">🎓 عرض الشهادة</button>`:''}${!passed(S.me,l.id)?`<button class="btn" data-act="retry">إعادة المحاولة</button>`:''}<button class="btn sec" data-go="home">العودة للدروس</button></div>`
      :`<button class="btn" data-act="submit">تسليم الإجابات</button>`;
  }
  return `<button class="back" data-go="home">→ دروس ${T.title}</button>
  <div class="card lesson"><div class="b b-gold">${T.icon} ${T.title} · الدرس ${i+1} من ${L.length} · ${l.mins} دقائق</div><h2>${l.title}</h2>${l.body}</div>
  <div class="card" id="quizCard"><h3 style="margin-top:0">اختبار قصير</h3>${S.quiz?quiz:`<p style="color:var(--mut)">ثلاثة أسئلة. تحتاج ${PASS} إجابات صحيحة لاجتياز الدرس.</p><button class="btn" data-act="quiz">ابدأ الاختبار</button>`}</div>`;
}
function vGloss(){
  return `<div class="card"><h3 style="margin-top:0">قاموس المصطلحات الرقمية</h3><input type="search" id="gq" placeholder="ابحث عن مصطلح…"><div class="gl" id="glist">${glist('')}</div></div>`;
}
function glist(q){q=q.trim().toLowerCase();return GLOSS.filter(g=>!q||g.join(' ').toLowerCase().includes(q)).map(g=>`<div><b>${g[0]}</b><i>${g[1]}</i><div>${g[2]}</div></div>`).join('')||'<div style="color:var(--mut)">لا نتائج</div>'}
function vCert(){
  return TRACKS.map(T=>{const L=T.lessons,n=doneCount(S.me,T.id);
    if(n<L.length)return `<div class="card" style="text-align:center"><h3>${T.icon} شهادة مسار ${T.title}</h3><p>أكمل دروس المسار الستة للحصول على الشهادة.</p><p><b>${n} من ${L.length}</b> دروس مكتملة</p><button class="btn sec" data-track="${T.id}" data-go="home">متابعة التعلّم</button></div>`;
    const d=myProg().done;const last=Math.max(...L.map(l=>(d[l.id]||{}).at||0));const tot=L.reduce((s,l)=>s+((d[l.id]||{}).score||0),0);
    return `<div class="card"><div class="cert"><div style="color:var(--mut)">البنك الزراعي السوداني · منصة الزراعي الرقمي</div><div class="t">${T.icon} شهادة إتمام</div><div>تشهد المنصة بأن</div><div class="nm">${esc(nameOf(S.me))}</div><div>قد أتمّ بنجاح <b>مسار ${T.title}</b> (${L.length} دروس)</div><div style="margin-top:8px;color:var(--mut)">الدرجة: ${tot} من ${L.length*3} · بتاريخ ${fmt(last)}</div><div style="margin-top:14px;font-size:13px;color:var(--mut)">إدارة تقنية المعلومات</div></div><p style="text-align:center;color:var(--mut);font-size:13px">يمكنك أخذ لقطة شاشة للشهادة ومشاركتها.</p><div style="text-align:center"><button class="btn sec" onclick="window.print()">🖨️ طباعة الشهادة</button></div></div>`}).join('');
}
function vAdmin(){
  const us=Object.keys(S.prog);
  const blocks=TRACKS.map(T=>{const L=T.lessons;const comp=us.filter(u=>doneCount(u,T.id)===L.length).length;const started=us.filter(u=>L.some(l=>(S.prog[u].done||{})[l.id])).length;
    const sc=us.flatMap(u=>L.map(l=>(S.prog[u].done||{})[l.id]).filter(Boolean).map(d=>d.score));const avg=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1):'—';
    return `<div class="card"><h3 style="margin-top:0">${T.icon} مسار ${T.title}</h3>
    <div class="kpis"><div class="kpi"><b>${started}</b><span>بدأوا المسار</span></div><div class="kpi"><b>${comp}</b><span>أكملوا المسار</span></div><div class="kpi"><b>${us.length?Math.round(comp/us.length*100):0}%</b><span>نسبة الإتمام</span></div><div class="kpi"><b>${avg}</b><span>متوسط الدرجة (من ٣)</span></div></div>
    ${L.map(l=>{const k=us.filter(u=>passed(u,l.id)).length;return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><div style="flex:0 0 46%;font-size:14px">${l.title}</div><div class="bar" style="flex:1"><i style="width:${us.length?k/us.length*100:0}%"></i></div><div style="width:50px;font-size:14px">${k}/${us.length}</div></div>`}).join('')}</div>`}).join('');
  const rows=us.sort((a,b)=>doneCount(b)-doneCount(a)||nameOf(a).localeCompare(nameOf(b),'ar')).map(u=>{const d=S.prog[u].done||{};const last=Math.max(0,...Object.values(d).map(x=>x.at||0));
    const cells=TRACKS.map(T=>{const n=doneCount(u,T.id),L=T.lessons;return `<td><div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${n/L.length*100}%"></i></div>${n===L.length?'🎓':n+'/'+L.length}</div></td>`}).join('');
    return `<tr><td><b>${esc(nameOf(u))}</b></td>${cells}<td>${last?fmt(last):'—'}</td></tr>`}).join('');
  return `<div class="kpis"><div class="kpi"><b>${us.length}</b><span>موظف دخل المنصة</span></div><div class="kpi"><b>${us.filter(u=>doneCount(u)===LESSONS.length).length}</b><span>أكملوا كل المسارات</span></div></div>
  ${blocks}
  <div class="card"><h3 style="margin-top:0">تقدّم الموظفين</h3><div class="tw"><table><tr><th>الموظف</th>${TRACKS.map(T=>`<th>${T.icon} ${T.title}</th>`).join('')}<th>آخر نشاط</th></tr>${rows||'<tr><td colspan=4 style="text-align:center;color:var(--mut)">لم يدخل أحد بعد</td></tr>'}</table></div></div>`;
}
function render(keepScroll){
  if(!S.me)return;nav();
  const v={home:vHome,lesson:vLesson,gloss:vGloss,cert:vCert,admin:vAdmin}[S.view]||vHome;
  if(S.view==='gloss'&&$('#gq'))return; // لا نعيد رسم البحث أثناء الكتابة
  $('#view').innerHTML=v();
  if(!keepScroll)window.scrollTo(0,0);
}

/* ================= التفاعل ================= */
document.addEventListener('click',async e=>{
  const tk=e.target.closest('[data-track]');if(tk){S.track=tk.dataset.track;if(!tk.dataset.go){render(true);return}}
  const g=e.target.closest('[data-go]');if(g){S.view=g.dataset.go;S.quiz=null;$('#view').innerHTML='';render();return}
  const o=e.target.closest('[data-open]');if(o){S.view='lesson';S.lesson=o.dataset.open;S.track=trackOf(S.lesson).id;S.quiz=null;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  const l=LESSONS.find(x=>x.id===S.lesson);
  if(act==='quiz'||act==='retry'){S.quiz={ans:[],submitted:false};render(true);$('#quizCard').scrollIntoView({behavior:'smooth'});return}
  if(act==='submit'){
    const ans=l.quiz.map((q,k)=>{const r=document.querySelector(`input[name=q${k}]:checked`);return r?+r.value:null});
    if(ans.some(x=>x===null))return toast('أجب على جميع الأسئلة');
    S.quiz={ans,submitted:true};const sc=ans.filter((x,k)=>x===l.quiz[k].a).length;
    const prev=myProg().done[l.id];
    if(!prev||sc>prev.score){a.disabled=true;try{await A.save(l.id,{score:sc,at:Date.now()})}catch(err){console.error(err);toast('تعذّر حفظ النتيجة')}}
    render(true);$('#quizCard').scrollIntoView({behavior:'smooth'});
    const T=trackOf(l.id);if(sc>=PASS&&doneCount(S.me,T.id)===T.lessons.length)toast('🎓 مبروك! أكملت مسار '+T.title+'، شهادتك جاهزة');
  }
});
document.addEventListener('input',e=>{if(e.target.id==='gq')$('#glist').innerHTML=glist(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='demoUser'){S.me=e.target.value;render()}if(e.target.id==='demoAdmin'){S.admin=e.target.checked;if(!S.admin&&S.view==='admin')S.view='home';render()}});

/* ================= الحفظ على الجهاز ================= */
const KEY='zr_digital_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({name:S.names.me||'',done:S.prog.me.done}))}catch(_){}}
function vWelcome(){
  return `<div class="card" style="max-width:520px;margin:auto;text-align:center"><div style="font-size:44px">👋</div><h2 style="margin:6px 0">مرحباً بك في منصة الزراعي الرقمي</h2>
  <p style="color:var(--mut)">اكتب اسمك كما تريده أن يظهر في شهادة الإتمام. يُحفظ اسمك وتقدّمك على هذا الجهاز فقط.</p>
  <form id="nameForm"><input id="nm" required placeholder="الاسم الكامل" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:10px;text-align:center"><button class="btn" style="width:100%">ابدأ التعلّم</button></form></div>`;
}
document.addEventListener('submit',e=>{if(e.target.id==='nameForm'){e.preventDefault();const v=e.target.querySelector('#nm').value.trim();if(!v)return;S.names.me=v;persist();S.view='home';render()}});
document.addEventListener('click',e=>{if(e.target.closest('#who')){S.view='welcome';$('#view').innerHTML=vWelcome();const i=$('#nm');i.value=S.names.me||'';i.focus()}});
(function start(){
  const d=load()||{};S.mode='local';S.admin=false;S.me='me';S.names.me=d.name||'';S.prog.me={done:d.done||{}};
  A={async save(id,v){S.prog.me.done={...S.prog.me.done,[id]:v};persist()}};
  if(!S.names.me){nav();$('#view').innerHTML=vWelcome();return}
  render();
})();
</script>
</body>
</html>
